<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Kalkulator Nilai</h1>
        <p>Hitung nilai akhir kamu dengan mudah</p>

        <div class="form-group">
            <label for="tugas">Nilai Tugas</label>
            <input type="number" id="tugas" placeholder="Masukkan nilai tugas">
        </div>

        <div class="form-group">
            <label for="uts">Nilai UTS</label>
            <input type="number" id="uts" placeholder="Masukkan nilai UTS">
        </div>

        <div class="form-group">
            <label for="uas">Nilai UAS</label>
            <input type="number" id="uas" placeholder="Masukkan nilai UAS">
        </div>

        <button onclick="hitungNilai()">Hitung Nilai</button>

        <div id="hasil"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
